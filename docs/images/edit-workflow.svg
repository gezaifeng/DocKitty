<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="285" viewBox="0 0 1120 285" role="img" aria-label="编辑一次，保存多次：历史仍然清楚"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#344a3c"/></marker></defs><rect width="1120" height="285" fill="#fffcf1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#202620"><text x="30" y="42" font-size="23" font-weight="700">编辑一次，保存多次：历史仍然清楚</text><path d="M205 148 L247 148" stroke="#344a3c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="115" width="180" height="76" fill="#202620"/><rect x="25" y="110" width="180" height="76" rx="2" fill="#fff" stroke="#202620" stroke-width="2"/><text x="115" y="141" text-anchor="middle" font-size="16" font-weight="600">选中一稿</text><text x="115" y="164" text-anchor="middle" font-size="16" font-weight="400">确认修改起点</text><path d="M427 148 L469 148" stroke="#344a3c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="252" y="115" width="180" height="76" fill="#202620"/><rect x="247" y="110" width="180" height="76" rx="2" fill="#fff" stroke="#202620" stroke-width="2"/><text x="337" y="141" text-anchor="middle" font-size="16" font-weight="600">选择编辑方式</text><text x="337" y="164" text-anchor="middle" font-size="16" font-weight="400">沿分支 / 新建分支</text><path d="M649 148 L691 148" stroke="#344a3c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="474" y="115" width="180" height="76" fill="#202620"/><rect x="469" y="110" width="180" height="76" rx="2" fill="#fff" stroke="#202620" stroke-width="2"/><text x="559" y="141" text-anchor="middle" font-size="16" font-weight="600">独立编辑副本</text><text x="559" y="164" text-anchor="middle" font-size="16" font-weight="400">Word / WPS 打开</text><path d="M871 148 L913 148" stroke="#344a3c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="696" y="115" width="180" height="76" fill="#202620"/><rect x="691" y="110" width="180" height="76" rx="2" fill="#cbe5b3" stroke="#202620" stroke-width="2"/><text x="781" y="141" text-anchor="middle" font-size="16" font-weight="600">第一次保存修改</text><text x="781" y="164" text-anchor="middle" font-size="16" font-weight="400">形成下一版本</text><rect x="918" y="115" width="180" height="76" fill="#202620"/><rect x="913" y="110" width="180" height="76" rx="2" fill="#fff" stroke="#202620" stroke-width="2"/><text x="1003" y="141" text-anchor="middle" font-size="16" font-weight="600">继续反复保存</text><text x="1003" y="164" text-anchor="middle" font-size="16" font-weight="400">更新这一稿</text><text x="30" y="245" font-size="17">需要开始下一阶段时，再创建下一稿；几次小修不会不断增加版本节点。</text></g></svg>